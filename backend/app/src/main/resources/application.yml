server:
  port: 8080

spring:
  application:
    name: workflow-automation-backend
  flyway:
    enabled: false
    baseline-on-migrate: true
    baseline-version: 1
    create-schemas: false
    validate-on-migrate: false
    out-of-order: false
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/workflow_db}
    username: ${SPRING_DATASOURCE_USERNAME:app_user}
    password: ${SPRING_DATASOURCE_PASSWORD:app123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: update
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${MAIL_USERNAME:${SPRING_MAIL_USERNAME:studentedu0428@gmail.com}}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
    default-encoding: UTF-8

management:
  endpoints:
    web:
      exposure:
        include: [ "health" ]
eternal:
  ai:
    base-url: ${AI_SERVICE_URL:http://localhost:3001}
    connect-timeout: 2000
    read-timeout: 5000
    mock-mode: false
    execution-path: /api/v1/analyze
    workflow-path: /api/v1/workflows/generate
    api-key: ${AI_SERVICE_API_KEY:local-dev-key}
jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000

workflow:
  step:
    connect-timeout-ms: 5000
    read-timeout-ms: 15000
  retry:
    max-attempts: 3
    initial-delay-ms: 500
    multiplier: 2.0
    max-delay-ms: 5000
    step:
      base-delay-ms: 200
    fixed:
        delay-ms: 2000
    exponential:
        base-delay-ms: 1000
  executor:
    pool-size: 5
  script:
    timeout-seconds: 10          
    max-memory-mb: 64 
